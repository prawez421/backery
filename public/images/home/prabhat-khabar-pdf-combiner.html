<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prabhat Khabar PDF Combiner</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#1f2937;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);background:white;border:1px solid #e5e7eb;border-radius:20px;padding:30px;box-shadow:0 15px 45px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:28px}
    p{color:#6b7280;line-height:1.6}
    button{width:100%;border:0;border-radius:12px;padding:15px 18px;background:#8f1728;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
    button:disabled{opacity:.55;cursor:not-allowed}
    progress{width:100%;height:12px;margin-top:20px}
    #status{margin-top:12px;font-size:14px;color:#4b5563;white-space:pre-wrap}
    .note{font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Ranchi City — 06 Oct 2026</h1>
    <p>Click the button to fetch all 16 newspaper pages, combine them in page order, and download one PDF.</p>

    <button id="combineBtn">Combine & Download PDF</button>
    <progress id="progress" max="16" value="0"></progress>
    <div id="status">Ready.</div>

    <p class="note">
      Note: This works only if the source CDN permits browser cross-origin (CORS) requests.
      If the CDN blocks them, a small server-side proxy is required.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    const BASE = "https://cdnimg.prabhatkhabar.com/pdf/";

    const pdfs = [
      "2026/10/06/rnc/ran/01/05oct26_pk_rnc_ran_1_r1.pdf_20261005192953_1604b6fe71.pdf",
      "2026/10/06/rnc/ran/02/05oct26_pk_rnc_ran_2_r1_20261005192953_e4bd283d2c.pdf",
      "2026/10/06/rnc/ran/03/05oct26_pk_rnc_ran_3_r1.pdf_20261005192953_d5ad4e8c5d.pdf",
      "2026/10/06/rnc/ran/04/05oct26_pk_rnc_ran_4_r1_20261005192953_8bca5b5e6e.pdf",
      "2026/10/06/rnc/ran/05/05oct26_pk_rnc_ran_5_r1.pdf_20261005192953_c0f865e365.pdf",
      "2026/10/06/rnc/ran/06/05oct26_pk_rnc_ran_6_r1_20261005192953_a49eefb3b0.pdf",
      "2026/10/06/rnc/ran/07/05oct26_pk_rnc_ran_7_r1_20261005192953_80e5c09a15.pdf",
      "2026/10/06/rnc/ran/08/05oct26_pk_rnc_ran_8_r1.pdf_20261005192953_ebfac3a412.pdf",
      "2026/10/06/rnc/ran/09/05oct26_pk_rnc_ran_9_r1_20261005192953_d7b39e243c.pdf",
      "2026/10/06/rnc/ran/10/05oct26_pk_rnc_ran_10_r1.pdf_20261005192953_a35d7ffe26.pdf",
      "2026/10/06/rnc/ran/11/05oct26_pk_rnc_ran_11_r1.pdf_20261005192953_0863496f7d.pdf",
      "2026/10/06/rnc/ran/12/05oct26_pk_rnc_ran_12_r1_20261005192953_70e4fbf662.pdf",
      "2026/10/06/rnc/ran/13/05oct26_pk_rnc_ran_13_r2.pdf_20261005192953_006d03cf5b.pdf",
      "2026/10/06/rnc/ran/14/05oct26_pk_rnc_ran_14_r1.pdf_20261005192953_ae3291edae.pdf",
      "2026/10/06/rnc/ran/15/05oct26_pk_rnc_ran_15_r1.pdf_20261005192953_4fd9f29812.pdf",
      "2026/10/06/rnc/ran/16/05oct26_pk_rnc_ran_16_r1.pdf_20261005192953_6a146caad2.pdf"
    ];

    const btn = document.getElementById("combineBtn");
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      progress.value = 0;

      try {
        if (!window.PDFLib) throw new Error("pdf-lib could not be loaded. Check your internet connection.");

        const { PDFDocument } = PDFLib;
        const merged = await PDFDocument.create();

        for (let i = 0; i < pdfs.length; i++) {
          status.textContent = `Fetching page ${i + 1} of ${pdfs.length}...`;

          const response = await fetch(BASE + pdfs[i]);
          if (!response.ok) {
            throw new Error(`Page ${i + 1} failed: HTTP ${response.status}`);
          }

          const bytes = await response.arrayBuffer();
          const source = await PDFDocument.load(bytes);
          const copiedPages = await merged.copyPages(source, source.getPageIndices());
          copiedPages.forEach(page => merged.addPage(page));

          progress.value = i + 1;
        }

        status.textContent = "Creating combined PDF...";
        const result = await merged.save();
        const blob = new Blob([result], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "Prabhat-Khabar-Ranchi-06-10-2026.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 10000);
        status.textContent = "Done — combined PDF downloaded.";
      } catch (err) {
        console.error(err);
        status.textContent =
          "Error: " + (err?.message || err) +
          "\n\nIf you see 'Failed to fetch' or a CORS error, the newspaper CDN is blocking direct browser requests. In that case this needs a small Next.js/PHP backend proxy.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
